# CareScript Supabase Configuration
project_id = "carescript"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]

[functions.ai-buddy]
verify_jwt = true

[functions.extract-prescription]
verify_jwt = true
