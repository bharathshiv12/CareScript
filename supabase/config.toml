# CareScript Supabase Configuration
project_id = "carescript"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://carescript.firebaseapp.com"]

[auth.third_party.firebase]
enabled = true
project_id = "carescript"

[functions.ai-buddy]
verify_jwt = false

[functions.extract-prescription]
verify_jwt = false
