# CareScript Supabase Configuration
project_id = "carescript"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
# Production default. The frontend sends its current origin explicitly, and
# local development remains allowed as a separate callback below.
site_url = "https://carescript-chi.vercel.app"
additional_redirect_urls = [
  "https://carescript-chi.vercel.app/auth/callback",
  "http://localhost:5173/auth/callback",
]

[functions.ai-buddy]
verify_jwt = true

[functions.extract-prescription]
verify_jwt = true
